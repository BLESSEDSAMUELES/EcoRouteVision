[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "terrapave"
version = "0.1.0"
description = "AI-powered road surface assessment, defect intelligence, and eco-routing engine."
readme = "README.md"
authors = [{ name = "TerraPave Team" }]
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "ultralytics>=8.0.0",
    "opencv-python>=4.6.0",
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
    "pillow>=9.0.0",
    "scikit-learn>=1.0.0",
    "requests>=2.28.0",
    "torch>=1.12.0",
    "torchvision>=0.13.0",
    "python-dotenv>=0.19.0",
]

[project.scripts]
terrapave-demo = "demo:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["terrapave*"]
